apiVersion: apps/v1
kind: Deployment
metadata:
  name: periscope
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: periscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: periscope
    spec:
      serviceAccountName: periscope
      containers:
        - name: periscope
          image: docker.io/crozltd/periscope:{{ .Values.version }}
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          env:
            # Discovery namespace = the pod's own namespace (where join Secrets live).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # debug explains a single scrape in full: every cluster, every
            # extractor, every request. Raise it while diagnosing, not for long.
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # json so the cluster's log collector can index the fields.
            - name: LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy:latest
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --https-address=:8443
            - --http-address=
            - --upstream=http://localhost:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/oauth/session/session_secret
            - --openshift-service-account=periscope
            - --pass-user-headers=true
            # Reading the dashboard needs get on services in this namespace.
            # This one gates a signed-in browser session.
            - '--openshift-sar={"namespace":"periscope","resource":"services","verb":"get"}'
            # The same check for a client that presents a bearer token instead of
            # signing in, which is how the API and the exports are reached from a
            # script. It has to be spelled out separately: the proxy only builds
            # a token authenticator at all when a delegate URL is configured, so
            # without this every `Authorization: Bearer` request is refused with
            # a 403 before it reaches the app, whatever the caller may do.
            #
            # The elevated check for /api/admin is deliberately not expressed
            # here. Delegate URLs are consulted only for token requests, so a
            # per-path rule would leave a browser session ungated. The app makes
            # that check itself, on every request. See admin.go.
            - '--openshift-delegate-urls={"/":{"namespace":"periscope","resource":"services","verb":"get"}}'
            # Forward the reader's own token as X-Forwarded-Access-Token, for a
            # signed-in browser session and for a client that presented a token
            # itself. It is the only way the app can ask what the reader may do
            # rather than what this pod may do, which is how /api/admin decides
            # who may purge stale cluster data. The proxy's own SAR cannot answer
            # that: it is checked once per session, not per request path.
            - --pass-access-token=true
            - --pass-user-bearer-token=true
{{- if .Values.publicJoinYAML }}
            # The join document holds no credential, so it can be fetched without
            # a login. That is what lets `oc apply -f <route>/yaml/new-cluster`
            # work directly on a cluster being onboarded.
            - --skip-auth-regex=^/yaml/
{{- end }}
          ports:
            - name: public
              containerPort: 8443
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-session
              mountPath: /etc/oauth/session
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: periscope-data
        - name: tls-certs
          secret:
            secretName: periscope-tls
        - name: oauth-session
          secret:
            secretName: periscope-oauth-session
