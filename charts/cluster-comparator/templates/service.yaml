apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
  {{- if .Values.oauthProxy.enabled }}
  annotations:
    # OpenShift service-ca mints the TLS secret oauth-proxy serves with.
    service.beta.openshift.io/serving-cert-secret-name: {{ include "hub.tlsSecret" . }}
  {{- end }}
spec:
  selector:
    {{- include "hub.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.oauthProxy.enabled }}
    - name: public
      port: {{ .Values.oauthProxy.port }}
      targetPort: {{ .Values.oauthProxy.port }}
    {{- else }}
    - name: http
      port: {{ .Values.appPort }}
      targetPort: {{ .Values.appPort }}
    {{- end }}
