# Cookie secret for oauth-proxy. Generated at render time; re-rendering rotates
# it (which just forces users to re-login). This is the only templating left besides
# the image tag.
apiVersion: v1
kind: Secret
metadata:
  name: periscope-oauth-session
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
type: Opaque
data:
  session_secret: {{ randAlphaNum 32 | b64enc }}
