version: 2

# Major version bumps are left out on purpose. They tend to need code changes
# (the PatternFly/React/Vite toolchain especially), so they are better handled
# deliberately than as a stream of pull requests. Security updates are separate
# and are not filtered by these rules.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      k8s:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*
      other:
        patterns:
          - '*'
        exclude-patterns:
          - k8s.io/*
          - sigs.k8s.io/*
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      patternfly:
        patterns:
          - '@patternfly/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      build:
        patterns:
          - vite
          - '@vitejs/*'
          - typescript
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
