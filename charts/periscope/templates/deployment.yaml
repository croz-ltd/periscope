{{- $host := include "periscope.host" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: periscope
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: periscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: periscope
    spec:
      serviceAccountName: periscope
      containers:
        - name: periscope
          image: docker.io/crozltd/periscope:{{ .Values.version }}
          imagePullPolicy: IfNotPresent
          args:
            - serve
            # The hub serves TLS itself with the service-ca certificate, and the
            # route reencrypts to it. It reads the certificate again when the
            # service CA rotates it.
            - --addr=:8443
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            # Every request needs an OpenShift login or token, and get on
            # services in this namespace. The UI login uses this pod's
            # ServiceAccount as the OAuth client, see serviceaccount.yaml.
            - --auth=openshift
            - --session-secret-file=/etc/periscope/session/session_secret
{{- if $host }}
            # Issues long-lived MCP tokens per user on /mcp/token. See
            # oauthclient-mcp.yaml.
            - --mcp-client-id=periscope-mcp
            - --mcp-client-secret-file=/etc/periscope/mcp-client/secret
{{- end }}
{{- if .Values.publicJoinYAML }}
            # The join document holds no credential, so it can be fetched without
            # a login. That is what lets `oc apply -f <route>/yaml/new-cluster`
            # work directly on a cluster being onboarded.
            - --public-join-yaml
{{- end }}
          env:
            # Discovery namespace = the pod's own namespace (where join Secrets live).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # debug explains a single scrape in full: every cluster, every
            # extractor, every request. Raise it while diagnosing, not for long.
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # json so the cluster's log collector can index the fields.
            - name: LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
          ports:
            - name: public
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls-certs
              mountPath: /etc/tls/private
              readOnly: true
            - name: session
              mountPath: /etc/periscope/session
              readOnly: true
{{- if $host }}
            - name: mcp-client
              mountPath: /etc/periscope/mcp-client
              readOnly: true
{{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: periscope-data
        - name: tls-certs
          secret:
            secretName: periscope-tls
        - name: session
          secret:
            secretName: periscope-oauth-session
{{- if $host }}
        - name: mcp-client
          secret:
            secretName: periscope-mcp-client
{{- end }}
