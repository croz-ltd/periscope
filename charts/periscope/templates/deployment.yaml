apiVersion: apps/v1
kind: Deployment
metadata:
  name: periscope
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: periscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: periscope
    spec:
      serviceAccountName: periscope
      containers:
        - name: periscope
          image: docker.io/crozltd/periscope:{{ .Values.version }}
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          env:
            # Discovery namespace = the pod's own namespace (where join Secrets live).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy:latest
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --https-address=:8443
            - --http-address=
            - --upstream=http://localhost:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/oauth/session/session_secret
            - --openshift-service-account=periscope
            - --pass-user-headers=true
            - '--openshift-sar={"namespace":"periscope","resource":"services","verb":"get"}'
          ports:
            - name: public
              containerPort: 8443
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-session
              mountPath: /etc/oauth/session
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: periscope-data
        - name: tls-certs
          secret:
            secretName: periscope-tls
        - name: oauth-session
          secret:
            secretName: periscope-oauth-session
