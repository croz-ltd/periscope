apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccount.name }}-secret-reader
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
rules:
  # Discover and read joined-cluster credential Secrets in the hub namespace.
  # (list/watch cannot be constrained by resourceName, so this is namespace-scoped;
  # keep the hub namespace dedicated to the app for least privilege.)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
