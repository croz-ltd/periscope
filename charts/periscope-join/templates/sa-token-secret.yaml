# A manually-created SA token Secret yields a long-lived (non-expiring) token,
# which is what the hub stores to poll this cluster.
apiVersion: v1
kind: Secret
metadata:
  name: periscope-reader-token
  namespace: periscope
  annotations:
    kubernetes.io/service-account.name: periscope-reader
  labels:
    app.kubernetes.io/name: periscope-join
type: kubernetes.io/service-account-token
