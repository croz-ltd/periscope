name: Bug report
description: Something in Periscope behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Periscope version
      description: Output of `periscope version`, or the container image tag.
      placeholder: 0.1.0+abc1234
    validations:
      required: true

  - type: input
    id: openshift
    attributes:
      label: OpenShift / Kubernetes version(s)
      description: Hub cluster, and the joined cluster(s) involved if relevant.
      placeholder: OpenShift 4.16.20 (hub), 4.14.x (joined)

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Extractor / scraping (wrong or missing version)
        - Drift matrix / comparison logic
        - Web UI
        - REST API / export / metrics
        - Helm charts / deployment
        - CLI (serve, report)
        - Other / unsure

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or API output
      description: >-
        Pod logs (`oc logs deploy/periscope`) and the relevant part of `/api/matrix`.
        Please redact cluster names, API URLs and tokens.
      render: shell
