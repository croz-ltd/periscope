# The container image tag, and how the pod logs.
# Everything else is inlined directly in the templates.
version: latest

# Log verbosity: debug | info | warn | error. Raise to debug to see every
# cluster, extractor and request while diagnosing a scrape.
logLevel: info

# Log output format: json for the cluster's log collector, text to read by eye.
logFormat: json

# Serve /yaml/new-cluster without a login, so a cluster can be onboarded with
# `oc apply -f https://<route>/yaml/new-cluster?name=<cluster>` directly. The
# document creates a read-only ServiceAccount and RBAC and carries no credential,
# but it does reveal the namespace and the label this hub watches, so it stays
# off by default. Leave it false and fetch the document with your own token:
#   oc apply -f <(curl -sH "Authorization: Bearer $(oc whoami -t)" \
#     "https://<route>/yaml/new-cluster?name=<cluster>")
publicJoinYAML: false
