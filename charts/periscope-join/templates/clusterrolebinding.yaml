# Read-only across the whole cluster via OpenShift's built-in cluster-reader,
# so new operator CRDs never cause a "forbidden".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: periscope-reader
  labels:
    app.kubernetes.io/name: periscope-join
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
  - kind: ServiceAccount
    name: periscope-reader
    namespace: periscope
