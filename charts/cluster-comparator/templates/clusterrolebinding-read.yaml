apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.clusterReadRoleName }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
{{- if eq .Values.rbac.mode "clusterReader" }}
  # OpenShift built-in read-only-everything ClusterRole.
  name: cluster-reader
{{- else }}
  name: {{ .Values.rbac.clusterReadRoleName }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
