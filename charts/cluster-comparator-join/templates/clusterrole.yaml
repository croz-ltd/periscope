{{- if eq .Values.rbac.mode "explicit" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbac.clusterRoleName }}
  labels:
    {{- include "join.labels" . | nindent 4 }}
rules:
  # --- OpenShift release + component operators --------------------------------
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions", "clusteroperators"]
    verbs: ["get", "list", "watch"]

  # --- OLM: installed operators + subscriptions (stable package name) ---------
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions", "subscriptions"]
    verbs: ["get", "list", "watch"]

  # --- Nodes: kubelet / OS versions ------------------------------------------
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # --- Portworx: StorageCluster CR (operator + managed CSI driver version) ----
  # core.libopenstorage.org/v1 storageclusters
  - apiGroups: ["core.libopenstorage.org"]
    resources: ["storageclusters"]
    verbs: ["get", "list", "watch"]

  # --- Dell CSM: ContainerStorageModule CR (operator + managed CSI version) ---
  # storage.dell.com/v1 containerstoragemodules
  - apiGroups: ["storage.dell.com"]
    resources: ["containerstoragemodules"]
    verbs: ["get", "list", "watch"]

  {{- with .Values.rbac.additionalRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
