{{- if .Values.oauthProxy.enabled }}
{{- $name := include "hub.sessionSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $session := "" }}
{{- if $existing }}
{{- $session = index $existing.data "session_secret" }}
{{- else }}
{{- $session = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  # Reused across upgrades (via lookup) so existing sessions aren't invalidated.
  session_secret: {{ $session }}
{{- end }}
