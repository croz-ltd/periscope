apiVersion: v1
kind: ServiceAccount
metadata:
  name: periscope
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
  annotations:
    # Lets the SA act as an OpenShift OAuth client for the oauth-proxy sidecar.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"periscope"}}'
