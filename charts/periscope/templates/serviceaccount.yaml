apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
  {{- if .Values.oauthProxy.enabled }}
  annotations:
    # Lets the SA act as an OpenShift OAuth client for the oauth-proxy sidecar.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ .Values.oauthProxy.routeName }}"}}'
  {{- end }}
