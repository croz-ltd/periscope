apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: periscope
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
spec:
  to:
    kind: Service
    name: periscope
  port:
    targetPort: public
  tls:
    # oauth-proxy serves TLS with the service-ca cert; reencrypt lets the router
    # (which trusts the service CA on OpenShift) validate the backend leg.
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
