{{- if .Values.token.create }}
# A manually-created SA token Secret yields a long-lived (non-expiring) token,
# which is what the hub stores to poll this cluster. The token controller
# populates .data.token and .data.ca\.crt after creation.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.token.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "join.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
{{- end }}
