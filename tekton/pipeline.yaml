apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: periscope-build
spec:
  description: >-
    Clone Periscope and build+push the container image (multi-stage Dockerfile
    builds the PatternFly UI + Go binary) to a registry. linux/amd64 only.
  params:
    - name: git-url
      default: https://github.com/croz-ltd/periscope.git
    - name: revision
      default: master
    - name: image
      description: >-
        Image repository to build and push, without a tag. Set this to your own
        registry, for example registry.example.com/platform/periscope.
      default: docker.io/crozltd/periscope
    - name: image-tag
      description: >-
        Image tag, also stamped into the binary as build metadata, so the
        version reads "<release>+tekton-<image-tag>".
      default: latest
    - name: node-image
      description: Node base image used by the Dockerfile's UI build stage.
      default: node:20-alpine
    - name: go-image
      description: Go base image used by the Dockerfile's build stage.
      default: golang:1.26.4
    - name: runtime-image
      description: Runtime base image for the final stage.
      default: registry.access.redhat.com/ubi9/ubi-micro:latest
  workspaces:
    - name: shared        # source checkout, shared between tasks
    - name: dockerconfig  # registry push credentials
  tasks:
    - name: clone
      taskRef:
        name: periscope-git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared
    - name: build
      runAfter: [clone]
      taskRef:
        name: periscope-buildah
      params:
        - name: IMAGE
          value: $(params.image):$(params.image-tag)
        - name: BUILD_ARGS
          value:
            - NODE_IMAGE=$(params.node-image)
            - GO_IMAGE=$(params.go-image)
            - RUNTIME_IMAGE=$(params.runtime-image)
            - BUILD=tekton-$(params.image-tag)
      workspaces:
        - name: source
          workspace: shared
        - name: dockerconfig
          workspace: dockerconfig
  results:
    - name: image-digest
      value: $(tasks.build.results.IMAGE_DIGEST)
