# Encrypts the session cookie of the UI login. It is kept across upgrades (via
# lookup), so an upgrade does not sign anybody out. A render that cannot look
# it up (helm template, Argo CD) makes a new one, which only means signing in
# again.
{{- $existing := lookup "v1" "Secret" "periscope" "periscope-oauth-session" }}
apiVersion: v1
kind: Secret
metadata:
  name: periscope-oauth-session
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
type: Opaque
data:
{{- if and $existing $existing.data (index $existing.data "session_secret") }}
  session_secret: {{ index $existing.data "session_secret" }}
{{- else }}
  session_secret: {{ randAlphaNum 32 | b64enc }}
{{- end }}
