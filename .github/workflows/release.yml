name: Release

# Publishes the container image to Docker Hub and, for tags, cross-platform
# binaries attached to a GitHub Release.
#
#   push to master  ->  crozltd/periscope:edge  +  :<short-sha>
#   push of a tag   ->  crozltd/periscope:<tag> +  :latest  +  GitHub Release
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account or robot/access-token user with push
#                       rights on the crozltd/periscope repository
#   DOCKERHUB_TOKEN     Docker Hub access token (not the account password)
#
# Optional repository variable, if the image ever moves:
#   IMAGE_NAME          defaults to crozltd/periscope

on:
  push:
    branches: [master]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without push credentials there is nothing to publish; say so plainly and
      # skip rather than failing the run (a fresh fork has no secrets).
      - name: Check Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set, skipping the image push."
          fi

      - name: Resolve image name and version
        if: steps.creds.outputs.present == 'true'
        id: meta
        run: |
          image="${{ vars.IMAGE_NAME || 'crozltd/periscope' }}"
          short_sha="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}+${short_sha}"
            tags="${image}:${GITHUB_REF_NAME},${image}:latest"
          else
            version="${short_sha}"
            tags="${image}:edge,${image}:${short_sha}"
          fi
          echo "image=${image}"     >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}"       >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.creds.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.present == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # linux/amd64 only, matching the OpenShift clusters this runs on.
      - uses: docker/build-push-action@v6
        if: steps.creds.outputs.present == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
        working-directory: web/app
      - run: npm run build
        working-directory: web/app

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries (UI embedded)
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          version="${GITHUB_REF_NAME}+${GITHUB_SHA::7}"
          mkdir -p dist
          build() {
            export GOOS="$1" GOARCH="$2"
            out="dist/periscope-${GOOS}-${GOARCH}${3:-}"
            go build -trimpath \
              -ldflags "-s -w -X github.com/croz-ltd/periscope/pkg/version.Raw=${version}" \
              -o "${out}" ./cmd/periscope
            chmod a+x "${out}"
          }
          build linux amd64
          build linux arm64
          build darwin arm64
          build windows amd64 .exe
          ( cd dist && sha256sum periscope-* > SHA256SUMS )
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Container image: \`${{ vars.IMAGE_NAME || 'crozltd/periscope' }}:${GITHUB_REF_NAME}\`" \
            dist/*
