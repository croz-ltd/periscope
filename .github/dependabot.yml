version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      k8s:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*

  - package-ecosystem: npm
    directory: /web/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patternfly:
        patterns:
          - '@patternfly/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
