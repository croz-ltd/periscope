# Read the labeled joined-cluster credential Secrets and the custom-grouping
# ConfigMap (periscope-groups) in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: periscope-secret-reader
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
rules:
  - apiGroups: [""]
    resources: ["secrets"]
{{- if .Values.allowClusterImport }}
    # create and update let the Add a cluster wizard store a joined cluster's
    # credentials itself. Only in this namespace, and only ever the Secret the
    # scrape then reads. Set allowClusterImport=false to keep the hub read-only,
    # and join clusters with the manifests from /yaml/new-cluster instead.
    verbs: ["get", "list", "watch", "create", "update"]
{{- else }}
    verbs: ["get", "list", "watch"]
{{- end }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
