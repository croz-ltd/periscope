apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: periscope
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
spec:
{{- if .Values.host }}
  host: {{ .Values.host }}
{{- end }}
  to:
    kind: Service
    name: periscope
  port:
    targetPort: public
  tls:
    # The hub serves TLS with the service-ca cert; reencrypt lets the router
    # (which trusts the service CA on OpenShift) validate the backend leg.
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
