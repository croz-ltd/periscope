# The hub checks every request with a TokenReview (who is it) and a
# SubjectAccessReview (may they read), which system:auth-delegator allows.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: periscope-auth-delegator
  labels:
    app.kubernetes.io/name: periscope
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: periscope
    namespace: periscope
