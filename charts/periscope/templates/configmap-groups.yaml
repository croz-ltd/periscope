# Example custom grouping. Edit `groups.yaml`, re-apply, and hit Refresh.
#   compare:    groups for the Compare page (version/config drift)
#   statistics: groups for the Statistics page (counts)
#   hidden:     keys removed from both pages
# (Component keys are listed on the app's "Docs" page.) Groups render in the
# order listed; a key can appear in multiple groups; unmatched keys are skipped
# and leftovers fall into an "Ungrouped" section on their default page. Delete
# this ConfigMap to use the built-in grouping.
apiVersion: v1
kind: ConfigMap
metadata:
  name: periscope-groups
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
data:
  groups.yaml: |
    compare:
      - title: Platform
        keys:
          - openshift
          - node-kubelet
      - title: Certificates
        keys:
          - cert-api
          - cert-ingress
      - title: Storage drivers
        keys:
          - default-storageclass
          - portworx-csi
          - dell-csi
    statistics:
      - title: Capacity
        keys:
          - node-count
          - storage-total
      - title: Virtual machines
        keys:
          - vm-total
          - vm-running
          - vm-stopped
    hidden: []
