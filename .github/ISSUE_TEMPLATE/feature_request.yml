name: Feature request
description: Suggest a new extractor, view or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you are trying to find out that Periscope cannot tell you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        For a new extractor, include the CRD group, version and resource, plus the
        field path that holds the version. Redacted `oc get <resource> -o yaml`
        output is the most useful thing you can attach.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
