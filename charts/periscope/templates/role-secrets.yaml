# Discover + read the labeled joined-cluster credential Secrets in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: periscope-secret-reader
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
