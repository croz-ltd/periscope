apiVersion: v1
kind: Service
metadata:
  name: periscope
  namespace: periscope
  labels:
    app.kubernetes.io/name: periscope
  annotations:
    # OpenShift service-ca mints the TLS secret oauth-proxy serves with.
    service.beta.openshift.io/serving-cert-secret-name: periscope-tls
spec:
  selector:
    app.kubernetes.io/name: periscope
  ports:
    - name: public
      port: 8443
      targetPort: 8443
